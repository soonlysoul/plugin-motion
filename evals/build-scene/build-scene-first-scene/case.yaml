{
  "schema_version": "1.0",
  "name": "build-scene-first-scene",
  "description": "Demande de Soon, telle qu'il la tape (US-3, US-4), juste après le storyboard : trois scènes à faire, aucune codée.",
  "tags": [
    "build-scene",
    "positive"
  ],
  "runs": 3,
  "expected_outcome": "Le skill build-scene est invoqué ; il prend Ouverture, la première scène, avec ses 150 images, annonce les images clés qu'il rendra (dont 0 et 149, la dernière), la planche contact et sa relecture indépendante avant la validation par Soon, sans toucher à Message ni à Final.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Le plan me va, attaque la première scène.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?build-scene\""
    },
    {
      "name": "scene-duration",
      "type": "regex",
      "target": "last_message",
      "pattern": "\\b150\\s+images\\b",
      "flags": "i"
    },
    {
      "name": "last-frame",
      "type": "regex",
      "target": "last_message",
      "pattern": "\\b149\\b"
    },
    {
      "name": "contact-sheet",
      "type": "regex",
      "target": "last_message",
      "pattern": "planche",
      "flags": "i"
    },
    {
      "name": "independent-reviewer",
      "type": "regex",
      "target": "last_message",
      "pattern": "indépendant|frame-reviewer",
      "flags": "i"
    },
    {
      "name": "not-validated",
      "type": "llm",
      "criteria": "PASS if the final reply leaves Ouverture short of « validée », including when it does not give its status or says Soon validates the scene later.\nFAIL only if it says Ouverture is « validée » now, or already validated by Soon.\n"
    },
    {
      "name": "only-ouverture",
      "type": "llm",
      "criteria": "PASS if the final reply builds or plans only the scene Ouverture, including when it lists Message and Final with their status. Saying it could not write the file in this session does not fail the case.\nFAIL only if it writes or plans code, key frames or a motion for Message or Final.\n"
    }
  ]
}
