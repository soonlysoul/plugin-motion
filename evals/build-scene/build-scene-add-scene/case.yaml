{
  "schema_version": "1.0",
  "name": "build-scene-add-scene",
  "description": "Demande voisine que Soon tape dans un projet avancé (US-2) : ajouter une scène change le plan, pas le code.",
  "tags": [
    "build-scene",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill build-scene n'est pas invoqué ; la réponse traite de l'ajout de la scène au storyboard et n'écrit aucun code de scène.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Ajoute une scène sur les tarifs entre la 2 et la 3.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?build-scene\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "pricing-scene",
      "type": "regex",
      "target": "last_message",
      "pattern": "tarif",
      "flags": "i"
    },
    {
      "name": "no-scene-code",
      "type": "llm",
      "criteria": "PASS if the final reply shows no code of a scene, including when it names a file such as src/scenes/Final.tsx or says the code comes later with build-scene.\nFAIL only if it writes or shows the code of a scene: TSX or JSX, a React component, or a <Composition>.\n"
    },
    {
      "name": "plan-first",
      "type": "llm",
      "criteria": "PASS if the final reply deals with the new scene in the plan, storyboard.md: it adds it, proposes its place or duration in the plan, or asks what the plan needs first (which scene gives way, the text of the prices), including when nothing is written yet.\nFAIL only if it ignores the plan and storyboard.md entirely.\n"
    }
  ]
}
