{
  "schema_version": "1.0",
  "name": "build-scene-add-scene",
  "description": "Demande voisine que Soon tape dans un projet avancé (US-2) : ajouter une scène change le plan, pas le code.",
  "tags": [
    "build-scene",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill build-scene n'est pas invoqué ; la réponse traite de l'ajout de la scène au storyboard et n'écrit aucun code de scène.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Ajoute une scène sur les tarifs entre la 2 et la 3.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?build-scene\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "about-the-plan",
      "type": "llm",
      "criteria": "PASS if the final reply deals with adding a scene about pricing between Message and Final in the plan, storyboard.md, and neither writes nor proposes the code of that scene (no .tsx, no Composition).\nFAIL if it writes or shows the code of a scene, or ignores the plan.\n"
    }
  ]
}
