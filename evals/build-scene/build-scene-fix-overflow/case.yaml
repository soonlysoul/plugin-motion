{
  "schema_version": "1.0",
  "name": "build-scene-fix-overflow",
  "description": "Demande de Soon, telle qu'il la tape (US-3, US-4), sur une scène validée dont le titre sort du cadre : la cause est dans src/scenes/Final.tsx.",
  "tags": [
    "build-scene",
    "positive"
  ],
  "runs": 3,
  "expected_outcome": "Le skill build-scene est invoqué sur Final ; il trouve la cause (taille fixe de 200 px, sans retour à la ligne) dans src/scenes/Final.tsx, propose ou fait une correction qui tient dans le cadre, et repasse la scène en « construite » : images clés et planche rendues de nouveau, relues, puis validation par Soon.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Le titre de la scène 3 déborde à droite, corrige-le.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?build-scene\""
    },
    {
      "name": "cause-file",
      "type": "regex",
      "target": "last_message",
      "pattern": "Final\\.tsx",
      "flags": "i"
    },
    {
      "name": "cause-nowrap",
      "type": "regex",
      "target": "last_message",
      "pattern": "nowrap",
      "flags": "i"
    },
    {
      "name": "cause-200",
      "type": "regex",
      "target": "last_message",
      "pattern": "\\b200\\b",
      "flags": "i"
    },
    {
      "name": "back-to-built",
      "type": "regex",
      "target": "last_message",
      "pattern": "construite",
      "flags": "i"
    },
    {
      "name": "contact-sheet",
      "type": "regex",
      "target": "last_message",
      "pattern": "planche",
      "flags": "i"
    },
    {
      "name": "fix-fits",
      "type": "llm",
      "criteria": "PASS if the fix the final reply makes or proposes keeps the title inside the 1920-pixel width — for instance by removing whiteSpace nowrap, lowering the font size or adding a right margin — including when the fix is not written yet.\nFAIL only if it proposes no fix, or keeps the 200 px size with whiteSpace nowrap.\n"
    },
    {
      "name": "review-before-validation",
      "type": "llm",
      "criteria": "PASS if the final reply has Final rendered and reviewed again before Soon validates it again, including when it says this could not run in this session. Saying the status still reads « validée » because nothing was written yet does not declare the scene fixed.\nFAIL only if it declares Final fixed and « validée » without a new render and review.\n"
    },
    {
      "name": "others-untouched",
      "type": "llm",
      "criteria": "PASS if the final reply leaves Ouverture and Message as they are, including when it names them or their status.\nFAIL only if it changes the code or the status of Ouverture or Message.\n"
    }
  ]
}
