{
  "schema_version": "1.0",
  "name": "build-scene-render-request",
  "description": "Demande voisine que Soon tape dans un projet prêt (US-6) : rendre le MP4 final n'est pas construire une scène.",
  "tags": [
    "build-scene",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill build-scene n'est pas invoqué ; la réponse traite du rendu final du projet et ne reconstruit aucune scène.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Toutes les scènes sont validées, sors-moi le MP4 final.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?build-scene\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "about-rendering",
      "type": "llm",
      "criteria": "PASS if the final reply deals with rendering the final MP4 of this project (a render command, the composition to render, or the fact that it cannot run the render here) and neither rebuilds nor re-reviews any scene.\nFAIL if it rewrites a scene, renders key frames or a contact sheet, or sends a scene back to review.\n"
    }
  ]
}
