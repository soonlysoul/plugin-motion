{
  "schema_version": "1.0",
  "name": "new-video-render-request",
  "description": "Demande voisine que Soon tape dans un projet vidéo avancé (US-6) : rendre la vidéo n'est pas créer un projet ; le dossier contient storyboard.md.",
  "tags": [
    "new-video",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill new-video n'est pas invoqué ; la réponse traite du rendu final de ce projet et ne propose pas d'en créer un nouveau.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Rends la vidéo finale en MP4.",
    "max_turns": 6,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?new-video\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "about-rendering",
      "type": "llm",
      "criteria": "PASS if the final reply deals with rendering the final MP4 of this project (a render command, the scenes not yet validated, or the fact that it cannot run the render here) and neither proposes nor starts the creation of a new Remotion project.\nFAIL if it proposes to create a new project, asks where to create one, or gives create-video commands.\n"
    }
  ]
}
