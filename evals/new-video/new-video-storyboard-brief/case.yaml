{
  "schema_version": "1.0",
  "name": "new-video-storyboard-brief",
  "description": "Demande voisine que Soon tape dans un projet vidéo déjà créé (US-2) : un brief à découper en scènes n'est pas une création de projet ; le dossier contient storyboard.md.",
  "tags": [
    "new-video",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill new-video n'est pas invoqué ; la réponse travaille le plan de la vidéo dans ce projet et ne propose pas d'en créer un nouveau.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "J'ai une idée de vidéo : 20 secondes pour présenter mon appli de notes, ton dynamique, trois temps forts. Découpe-la en scènes avant qu'on code quoi que ce soit.",
    "max_turns": 6,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?new-video\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "about-the-plan",
      "type": "llm",
      "criteria": "PASS if the final reply works on the plan of this video in the current project (it restates the brief, asks a question about it, or proposes scenes) and neither proposes nor starts the creation of a new Remotion project (no create-video, no new folder to choose).\nFAIL if it proposes to create a project, asks where to create one, or says that the current folder is not a video project.\n"
    }
  ]
}
