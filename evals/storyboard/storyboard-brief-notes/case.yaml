{
  "schema_version": "1.0",
  "name": "storyboard-brief-notes",
  "description": "Brief de Soon, tel qu'il le tape (US-2, US-7), dans un projet vidéo neuf : storyboard.md au format par défaut, sans scène. Le public manque au brief.",
  "tags": [
    "storyboard",
    "positive"
  ],
  "runs": 3,
  "expected_outcome": "Le skill storyboard est invoqué ; il annonce l'état de storyboard.md (1920×1080 à 30 i/s, aucune scène), reprend la durée du brief en images (600) et pose une seule question, sur le public, sans découper la vidéo ni écrire de code.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "J'ai une idée de vidéo : 20 secondes pour présenter mon appli de notes, ton dynamique, trois temps forts. Découpe-la en scènes avant qu'on code quoi que ce soit.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?storyboard\""
    },
    {
      "name": "total-in-frames",
      "type": "regex",
      "target": "last_message",
      "pattern": "\\b600\\s+images\\b",
      "flags": "i"
    },
    {
      "name": "one-question-first",
      "type": "llm",
      "criteria": "PASS if the final reply does all four: (1) reports what storyboard.md holds now, namely the 1920×1080 format at 30 fps and no scene yet; (2) restates the 20-second total as 600 frames (« images »); (3) asks exactly one question, and that question is about the target audience (« public ») of the video; (4) proposes no scene yet and writes no code.\nFAIL if any of the four is missing, if it asks two questions or more, or if it already lists or describes scenes.\n"
    }
  ]
}
