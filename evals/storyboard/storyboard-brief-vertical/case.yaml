{
  "schema_version": "1.0",
  "name": "storyboard-brief-vertical",
  "description": "Brief de Soon, tel qu'il le tape (US-2, US-7), dans un projet vidéo neuf : un format vertical autre que celui de storyboard.md ; le public et le ton manquent au brief.",
  "tags": [
    "storyboard",
    "positive"
  ],
  "runs": 3,
  "expected_outcome": "Le skill storyboard est invoqué ; il annonce l'état de storyboard.md (aucune scène), retient le format vertical 1080×1920 au lieu de 1920×1080, reprend la durée en images (450) et pose une seule question, sur le public, sans découper la vidéo ni écrire de code.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Voici le brief : une vidéo verticale de 15 secondes qui annonce la sortie de ma newsletter. Prépare le plan scène par scène.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?storyboard\""
    },
    {
      "name": "state-line",
      "type": "regex",
      "target": "last_message",
      "pattern": "1920\\s*[×x]\\s*1080 à 30 i/s",
      "flags": "i"
    },
    {
      "name": "no-scene-yet",
      "type": "regex",
      "target": "last_message",
      "pattern": "aucune\\s+scène",
      "flags": "i"
    },
    {
      "name": "vertical-format",
      "type": "regex",
      "target": "last_message",
      "pattern": "1080\\s*[×x]\\s*1920",
      "flags": "i"
    },
    {
      "name": "total-in-frames",
      "type": "regex",
      "target": "last_message",
      "pattern": "\\b450\\s+images\\b",
      "flags": "i"
    },
    {
      "name": "one-question",
      "type": "llm",
      "criteria": "PASS if the final reply asks Soon one single question, and that question is about the target audience (« public ») of the video. Naming what else the brief lacks, giving examples of audiences, or calling it the first question does not make a second question.\nFAIL only if it asks two questions or more, or if its one question is not about the audience.\n"
    },
    {
      "name": "no-scene-proposed",
      "type": "llm",
      "criteria": "PASS if the final reply proposes no scene yet, including when it restates the brief or says the highlights are not named yet.\nFAIL only if it lists, names or describes one scene or more, or writes code.\n"
    }
  ]
}
