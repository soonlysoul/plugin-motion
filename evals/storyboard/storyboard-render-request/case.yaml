{
  "schema_version": "1.0",
  "name": "storyboard-render-request",
  "description": "Demande voisine que Soon tape dans un projet vidéo (US-6) : rendre la vidéo n'est pas la storyboarder, même dans un dossier qui contient storyboard.md.",
  "tags": [
    "storyboard",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill storyboard n'est pas invoqué ; la réponse traite du rendu final et ne réécrit pas le storyboard.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Rends la vidéo finale en MP4.",
    "max_turns": 6,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?storyboard\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "about-rendering",
      "type": "llm",
      "criteria": "PASS if the final reply deals with rendering the final MP4 (a render command, the scenes not yet validated, or the fact that it cannot run the render here) and neither rewrites nor updates the storyboard.\nFAIL if it proposes a new or modified storyboard, lists new scenes, or asks brief questions (audience, tone, duration) instead.\n"
    }
  ]
}
