{
  "schema_version": "1.0",
  "name": "render-video-still",
  "description": "Demande voisine, du ressort du skill officiel remotion-render, chargé dans la session : une image fixe d'une scène n'est pas le rendu final.",
  "tags": [
    "render-video",
    "negative",
    "remotion-render"
  ],
  "runs": 3,
  "expected_outcome": "Le skill render-video n'est pas invoqué ; la réponse rend, ou donne la commande qui rend, la seule image 120 de la composition Message en PNG.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Rends l'image 120 de la scène Message en PNG, je veux la mettre dans la présentation.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?render-video\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "single-still",
      "type": "llm",
      "criteria": "PASS if the final reply renders, or gives the command that renders, the single frame 120 of the composition Message as a PNG (for instance npx remotion still Message out/message-120.png --frame=120).\nFAIL if it renders the whole video or an MP4, renders a set of key frames or a contact sheet, or announces a check of the video against the storyboard.\n"
    }
  ]
}
