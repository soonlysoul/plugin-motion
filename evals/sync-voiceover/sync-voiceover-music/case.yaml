{
  "schema_version": "1.0",
  "name": "sync-voiceover-music",
  "description": "Demande voisine sur le son de la vidéo, sans voix à transcrire ni repère à caler : une musique de fond sous la voix off.",
  "tags": [
    "sync-voiceover",
    "negative"
  ],
  "runs": 3,
  "expected_outcome": "Le skill sync-voiceover n'est pas invoqué ; la réponse ajoute public/musique.mp3 à la composition Video, à un volume nettement inférieur à celui de la voix, sans transcrire ni toucher aux repères.",
  "context": {
    "scaffold_script": "setup.sh"
  },
  "execution": {
    "prompt": "Ajoute une musique de fond, public/musique.mp3, nettement plus bas que la voix.",
    "max_turns": 8,
    "allowed_tools": [
      "Skill",
      "Read",
      "Glob",
      "Grep"
    ]
  },
  "graders": [
    {
      "name": "skill-not-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?sync-voiceover\"",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "music-under-voice",
      "type": "llm",
      "criteria": "PASS if the final reply adds public/musique.mp3 to the composition Video, done or given as the change to make in src/Root.tsx, as an <Audio> with staticFile(\"musique.mp3\") at a volume below that of the voiceover (any volume below 1, constant or faded in and out), next to the voiceover's own <Audio>, which stays. Fades, a loop, or a constant that keeps the same durations are fine.\nFAIL if it transcribes audio, changes the value of a cue, of a durationInFrames or of a scene status, or removes the voiceover's <Audio>.\n"
    }
  ]
}
